# Single source of truth for the AI agent setup shared by Claude Code and Codex.
# Rendered into ~/.claude.json (via `claude mcp`), ~/.claude/settings.json and
# ~/.codex/config.toml by the templates and scripts in this repo.
#
# Nothing here may be company-specific. Work values (org names, tokens) live in
# 1Password and reach the MCP servers through ~/.config/dotfiles/work.env,
# which the server command sources at launch.

agents:
  # Every agent session starts its own copy of each stdio server, so their
  # memory adds up fast. Node servers run from packages installed globally
  # (`mcp_packages` below) rather than `npx -y`, which keeps an `npm exec`
  # process of 100-300 MB resident next to every server it starts.
  mcp:
    # Available on every machine.
    common:
      playwright:
        command: playwright-mcp
      executor:
        url: https://executor.sh/levexis/mcp

    # Only on machines initialised with work=true. `sh -c` sources work.env so
    # tokens never land in the agents' own config files (or their backups).
    work:
      azure-devops:
        command: sh
        args:
          - -c
          # PAT when 1Password has ado_pat (pat mode wants base64 "user:token"),
          # otherwise the Azure CLI login. Write $VAR, not ${VAR:-}: Claude
          # Code expands ${...} itself before sh runs, with its own env.
          - >-
            . "$HOME/.config/dotfiles/work.env" &&
            if [ -n "$ADO_PAT" ]; then
            export PERSONAL_ACCESS_TOKEN="$(printf 'pat:%s' "$ADO_PAT" | base64 | tr -d '\n')";
            exec mcp-server-azuredevops "$ADO_ORG" --authentication pat;
            else exec mcp-server-azuredevops "$ADO_ORG" --authentication azcli; fi
      sonarqube:
        command: sh
        args:
          - -c
          # Uncapped, the JVM sizes its heap from host RAM and each container
          # grows to ~1 GB. 512 MB still fits the analyzer download (384 MB
          # ran out of heap).
          - . "$HOME/.config/dotfiles/work.env" && exec "${CONTAINER_RUNTIME:-docker}" run --init --pull=always -i --rm -e SONARQUBE_TOKEN -e SONARQUBE_URL -e SONARQUBE_MCP_IN_CONTAINER=true -e JAVA_OPTS="-Xmx512m -XX:+UseSerialGC" docker.io/sonarsource/sonarqube-mcp

  # npm packages behind the MCP commands above, installed with `vp add -g` by
  # run_onchange_after_30-agents.sh. Update them with `vp update -g`.
  mcp_packages:
    common: ["@playwright/mcp"]
    work: ["@azure-devops/mcp"]

  # Installed into ~/.agents/skills with the `skills` CLI. Codex reads that
  # directory directly; `claude: true` also links them into ~/.claude/skills.
  skills:
    - source: mattpocock/skills
      skills:
        - ask-matt
        - code-review
        - codebase-design
        - diagnosing-bugs
        - domain-modeling
        - grill-me
        - grill-with-docs
        - grilling
        - handoff
        - implement
        - implement-spec
        - improve-codebase-architecture
        - pr
        - prototype
        - research
        - retro
        - setup-matt-pocock-skills
        - tdd
        - teach
        - to-questionnaire
        - to-spec
        - to-tickets
        - triage
        - wait-what
        - wayfinder
        - wizard
        - writing-for-agents
      claude: false # Claude gets these from the mattpocock-skills plugin
    # Beta and misc skills are published through skills.sh, outside the plugin.
    - source: mattpocock/skills
      skills:
        - claude-handoff
        - git-guardrails-claude-code
        - migrate-to-shoehorn
        - scaffold-exercises
        - setup-pre-commit
      claude: true
    - source: shadcn/improve
      skills: [improve]
      claude: true
    - source: vercel-labs/skills
      skills: [find-skills]
      claude: true
    - source: humanlayer/skills
      skills: [show-me]
      claude: true
    - source: Leonxlnx/taste-skill
      skills: [design-taste-frontend]
      claude: true

  # p3-stack: pstack rebuilt for T3 Code. Cloned to `path` by
  # .chezmoiexternal.toml.tmpl instead of installed with the skills CLI, because
  # its skills reference agents/ and README.md elsewhere in the repo.
  # run_after_31-p3-stack.sh links every skills/* into ~/.agents/skills and
  # ~/.claude/skills.
  p3stack:
    repo: https://github.com/uzairansaruzi/p3-stack.git
    path: .local/share/p3-stack
    exclude: [tdd, teach] # Matt's versions win

  # Removed on every machine by run_onchange_after_30-agents.sh. Drop an entry
  # once every machine has applied it.
  retired:
    # MCP servers, also dropped from ~/.codex/config.toml by its template.
    mcp:
      # Rarely used next to playwright, which covers the same browser work.
      - chrome-devtools
    skills:
      # Replaced by p3-stack.
      - how
      - why
      - technical-writing
      - create-verification-skill
      - maintain-verification-skill
      - typescript-best-practices
      - principle-type-system-discipline
      - principle-boundary-discipline
      - unslop
      # Matt's beta skills, and one he dropped upstream.
      - loop-me
      - setup-ts-deep-modules
      - writing-beats
      - writing-fragments
      - writing-shape
      - resolving-merge-conflicts
    claude:
      plugins:
        - pstack@open-pstack
        - claude-obsidian@agricidaniel-claude-obsidian
        - mattpocock-skills@claude-plugins-official
      marketplaces:
        - open-pstack
        - agricidaniel-claude-obsidian
    codex:
      plugins:
        - pstack@open-pstack
      marketplaces:
        - open-pstack

  claude:
    marketplaces:
      - anthropics/claude-plugins-official
      - mattpocock/skills
    plugins:
      - mattpocock-skills@mattpocock

    # ~/.claude/settings.json is also written by Claude itself, so it is merged
    # rather than replaced. `defaults` only fill in missing keys (changes you
    # make in /config stick); `managed` always win.
    settings:
      defaults:
        model: opus[1m]
        effortLevel: high
        advisorModel: opus
        permissions:
          defaultMode: auto
        disableClaudeAiConnectors: true
        enableWorkflows: true
        worktree:
          baseRef: fresh
        tui: fullscreen
        theme: dark
        editorMode: normal
        inputNeededNotifEnabled: true
        agentPushNotifEnabled: true
        enabledPlugins:
          mattpocock-skills@mattpocock: true
      managed:
        statusLine:
          type: command
          command: bash ~/.claude/statusline-command.sh
        # No Co-Authored-By trailer on commits, no "Generated with" line on PRs.
        attribution:
          commit: ""
          pr: ""

  codex:
    plugins: []
    # Same merge rules for ~/.codex/config.toml, which the Codex app rewrites
    # constantly (project trust, desktop prefs, plugin state).
    config:
      defaults:
        model: gpt-6-sol
        model_reasoning_effort: medium
        model_reasoning_summary: concise
        model_verbosity: low
        personality: pragmatic
        approvals_reviewer: auto_review
      managed:
        features:
          hooks: true
          memories: false
          multi_agent: true
        memories:
          generate_memories: false
          use_memories: false
    # Extra per-server Codex settings merged onto the MCP definitions above.
    mcp_overrides:
      executor:
        tools:
          skills:
            approval_mode: approve
          execute:
            approval_mode: approve
