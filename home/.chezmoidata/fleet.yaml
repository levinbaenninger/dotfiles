# Machine names shown in the prompt (Starship) and Claude status line.
fleet:
  # Headless work hosts that receive a renewed Azure DevOps PAT from the WSL
  # work laptop. These SSH targets must resolve there over Tailscale.
  work:
    - levin@r2-d2
  # Server whose localhost ports the Mac and the work laptop forward to their
  # own localhost, shifted by 10000 (~/.local/bin/dev-tunnel).
  tunnelHost: levin@r2-d2
  # Hostname -> name shown in prompts.
  hosts:
    Millennium-Falcon: falcon
    devbox-01: R2-D2
    r2-d2: R2-D2
    r2d2: R2-D2
