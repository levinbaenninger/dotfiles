# Machine and user names shown in the prompt (Starship), the Claude status
# line and SSH aliases. Star Wars droids for the exe.dev fleet.
fleet:
  # exe.dev VMs: short name -> VM name. Gives `ssh <short>` and shows <short>
  # instead of the VM name in prompts. exe.dev VM names need 5+ characters.
  exe:
    r2d2: levin-r2d2
    c3po: levin-c3po
  # exe.dev VMs (short names) running in work mode: they receive a renewed
  # Azure DevOps PAT (scripts/renew-ado-pat.sh on the work laptop).
  work:
    - c3po
  # Other machines: hostname -> name shown in prompts.
  hosts:
    Millennium-Falcon: falcon
  # Login users -> name shown in prompts (exe.dev always logs in as exedev).
  users:
    exedev: levin
